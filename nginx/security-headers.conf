# Security headers for the web pages (see backend/SECURITY.md). The rest of the Content Security
# Policy is set in index.html at build time; frame-ancestors can only be sent as a header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
# The microphone is used by the optional voice input on the application form.
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;
